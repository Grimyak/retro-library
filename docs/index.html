<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Collection</title>
<meta name="description" content="A browsable catalogue of a retro game collection.">
<link rel="preload" href="data/games.json" as="fetch" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🕹️</text></svg>">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>Game Collection</h1>
    <dl class="stats" id="stats"></dl>
  </div>
</header>

<nav class="toolbar" id="toolbar">
  <div class="wrap">
    <div class="row row-search">
      <div class="search">
        <input id="q" type="search" placeholder="search titles, developers, series" autocomplete="off" spellcheck="false">
        <button id="qclear" type="button" aria-label="Clear search" hidden>&times;</button>
      </div>
      <select id="sort" aria-label="Sort by">
        <option value="title">A–Z</option>
        <option value="rating">Highest rated</option>
        <option value="year">Newest first</option>
        <option value="yearAsc">Oldest first</option>
        <option value="size">Largest file</option>
      </select>
      <select id="genre" aria-label="Filter by genre"><option value="">All genres</option></select>
      <div class="seg" id="view" role="group" aria-label="Artwork style">
        <button data-view="cover" aria-pressed="true" title="Flat box art">
          <svg viewBox="0 0 20 20"><rect x="3.5" y="2.5" width="13" height="15" rx="1.5"/></svg>Covers</button>
        <button data-view="box3d" aria-pressed="false" title="3D boxes">
          <svg viewBox="0 0 20 20"><path d="M4 5.5l6-3 6 3v9l-6 3-6-3z"/><path d="M4 5.5l6 3 6-3M10 8.5v9"/></svg>Boxes</button>
      </div>
    </div>
    <div class="row row-systems" id="systems"></div>
  </div>
</nav>

<main class="wrap">
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing matches those filters.</p>
  <button class="more" id="more" hidden>Show more</button>
</main>

<footer class="wrap foot">
  <p>Metadata and artwork scraped via ScreenScraper into ES-DE — box art, 3D boxes, cartridge
     and disc scans, title screens, screenshots and logos all come from that scrape.</p>
  <p id="generated"></p>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-back" data-close></div>
  <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="close" data-close aria-label="Close">&times;</button>
    <div class="sheet-body" id="sheet-body"></div>
  </article>
</div>

<script src="assets/app.js"></script>
</body>
</html>
